<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Mother's Day</title>
<meta property="og:title" content="Happy Mother's Day 💌">
<meta property="og:description" content="Whoever sent you this thinks you're the best mom in the world 🐾">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;min-height:100dvh;width:100%;overflow:hidden;
  font-family:'Caveat',cursive;
  background:linear-gradient(160deg,#1a2a3a 0%,#2d4a5e 40%,#3d6b7e 100%);
  transition:background 1.4s;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;user-select:none;position:relative;
}
body.open{background:linear-gradient(160deg,#f5f0eb,#e8e0d8 40%,#f0ebe5)}
body.c1{background:linear-gradient(160deg,#ffecd2,#fcb69f)}
body.c2{background:linear-gradient(160deg,#a1c4fd,#c2e9fb)}
body.c3{background:linear-gradient(160deg,#fbc2eb,#a6c1ee)}
body.c4{background:linear-gradient(160deg,#ffeaa7,#dfe6e9)}
body.c5{background:linear-gradient(160deg,#ff9a9e,#fecfef)}

body.shake{animation:shake .4s ease-out}
@keyframes shake{
0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px) rotate(-1deg)}
40%{transform:translate(6px,-6px) rotate(1deg)}60%{transform:translate(-4px,2px)}
80%{transform:translate(3px,-3px) rotate(.5deg)}
}
body.megashake{animation:mshake .6s ease-out}
@keyframes mshake{
0%,100%{transform:translate(0,0)}10%{transform:translate(-14px,8px) rotate(-3deg)}
20%{transform:translate(12px,-10px) rotate(2deg)}30%{transform:translate(-10px,6px) rotate(-2deg)}
40%{transform:translate(8px,-4px) rotate(3deg)}50%{transform:translate(-6px,10px)}
60%{transform:translate(10px,-8px) rotate(2deg)}
}

.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.snow-l{z-index:1;opacity:0;transition:opacity 1.5s}
body.open .snow-l,body.c1 .snow-l,body.c2 .snow-l,body.c3 .snow-l,body.c4 .snow-l,body.c5 .snow-l{opacity:1}
.husky-l{z-index:3}.paw-l{z-index:5}.combo-l{z-index:8}
.flash-l{z-index:100;background:#fff;opacity:0;transition:opacity .1s;pointer-events:none}
.flash-l.flash{opacity:.6;transition:opacity 0s}

.sf{position:absolute;top:-30px;color:#c8d8e4;animation:snowfall var(–d) var(–dl) linear infinite}
@keyframes snowfall{
0%{transform:translateY(0) translateX(0) rotate(0)}
50%{transform:translateY(50vh) translateX(var(–dr)) rotate(180deg)}
100%{transform:translateY(105vh) translateX(calc(var(–dr)*-.5)) rotate(360deg)}
}

.pp{position:absolute;font-size:28px;animation:pf 1.4s ease-out forwards}
@keyframes pf{0%{opacity:.9;transform:scale(1.3) rotate(var(–r))}100%{opacity:0;transform:scale(.3) rotate(var(–r)) translateY(-40px)}}

/* huskies styled but animated via JS */
.fh{
position:absolute;border-radius:50%;object-fit:cover;
border:3px solid rgba(255,255,255,.85);
filter:drop-shadow(0 6px 20px rgba(0,0,0,.35));
will-change:transform,opacity;
}
.hr{
position:absolute;border-radius:50%;object-fit:cover;
border:3px solid rgba(255,255,255,.9);
filter:drop-shadow(0 8px 24px rgba(0,0,0,.4));
will-change:transform,opacity;
}
.hr-big{
position:absolute;border-radius:50%;object-fit:cover;
border:4px solid rgba(255,255,255,.95);
filter:drop-shadow(0 12px 40px rgba(0,0,0,.5));
will-change:transform,opacity;
}

.bp{position:absolute;will-change:transform,opacity}

.rain-overlay{
position:fixed;inset:0;z-index:50;pointer-events:none;
background:radial-gradient(circle,transparent 30%,rgba(0,0,0,.3));
opacity:0;transition:opacity .3s;
}
.rain-overlay.active{opacity:1}

.env{text-align:center;cursor:pointer;z-index:2;animation:ef 3s ease-in-out infinite}
.env.exit{animation:eo 1.1s ease-in-out forwards}
.env-i{font-size:100px;margin-bottom:24px;filter:drop-shadow(0 12px 32px rgba(0,0,0,.3))}
.env-t{font-family:‘Cormorant Garamond’,serif;font-size:16px;color:rgba(255,255,255,.45);letter-spacing:4px;text-transform:uppercase;animation:gp 2.5s ease-in-out infinite}
.env-p{margin-top:16px;font-size:22px;opacity:.35;letter-spacing:6px}
@keyframes ef{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-14px) rotate(1deg)}}
@keyframes eo{0%{transform:scale(1);opacity:1}50%{transform:scale(1.4) rotate(6deg);opacity:.7}100%{transform:scale(2.5);opacity:0}}
@keyframes gp{0%,100%{opacity:.45}50%{opacity:.9}}

.card{z-index:2;text-align:center;max-width:440px;width:90%;padding:36px 24px;display:none;flex-direction:column;align-items:center;gap:20px;opacity:0;transform:translateY(40px)}
.card.show{display:flex;animation:fiu 1s ease-out forwards}
@keyframes fiu{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:translateY(0)}}
.ch{font-family:‘Cormorant Garamond’,serif;font-size:13px;letter-spacing:6px;text-transform:uppercase;color:#8a9eaa;font-weight:600}
.dv{width:60px;height:1px;background:linear-gradient(90deg,transparent,#b0c4cf,transparent)}
.msg{font-family:‘Caveat’,cursive;font-size:30px;color:#3a5568;line-height:1.4;font-weight:700;min-height:100px;display:flex;align-items:center;justify-content:center}
.cb{animation:blink .8s step-end infinite;margin-left:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.btn{position:relative;background:linear-gradient(135deg,#4a90b8,#357a9e 50%,#2d6a8a);color:#fff;border:none;padding:20px 48px;font-family:‘Permanent Marker’,cursive;font-size:24px;border-radius:60px;cursor:pointer;letter-spacing:2px;box-shadow:0 6px 24px rgba(45,106,138,.4),0 2px 8px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .15s;z-index:6}
.btn:hover{transform:scale(1.05)}.btn:active{transform:scale(.93)}
.btn.mega{background:linear-gradient(135deg,#e74c3c,#c0392b);box-shadow:0 6px 30px rgba(231,76,60,.5);animation:bp2 .6s ease-in-out infinite;padding:22px 52px;font-size:26px}
.btn.ultra{background:linear-gradient(135deg,#8e44ad,#9b59b6 50%,#e74c3c);box-shadow:0 6px 40px rgba(142,68,173,.6);animation:bra 2s linear infinite,bp2 .4s ease-in-out infinite;padding:26px 56px;font-size:28px}
.btn.god{background:linear-gradient(135deg,#f39c12,#e74c3c,#8e44ad,#3498db,#2ecc71);background-size:300% 300%;box-shadow:0 0 60px rgba(243,156,18,.6);animation:bra 1s linear infinite,gp2 .3s ease-in-out infinite,bgs 3s linear infinite;padding:28px 60px;font-size:30px}
@keyframes bp2{0%,100%{box-shadow:0 6px 30px rgba(231,76,60,.5)}50%{box-shadow:0 6px 50px rgba(231,76,60,.8),0 0 80px rgba(231,76,60,.3)}}
@keyframes gp2{0%,100%{box-shadow:0 0 40px rgba(243,156,18,.8)}50%{box-shadow:0 0 80px rgba(243,156,18,1),0 0 160px rgba(231,76,60,.6)}}
@keyframes bra{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
@keyframes bgs{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.combo{position:fixed;top:20px;right:20px;z-index:9;font-family:‘Permanent Marker’,cursive;font-size:24px;color:#e74c3c;opacity:0;transition:opacity .3s;text-shadow:0 2px 8px rgba(231,76,60,.3);text-align:center}
.combo.show{opacity:1}.combo.pop{animation:cpop .3s ease-out}
@keyframes cpop{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}
.cl{font-size:11px;font-family:‘Cormorant Garamond’,serif;color:#8a9eaa;letter-spacing:3px;text-transform:uppercase;text-shadow:none}
.ctt{font-size:14px;color:#9b59b6;margin-top:2px}

.so{opacity:0;transform:translateY(15px);transition:opacity .8s,transform .8s}
.so.show{opacity:1;transform:translateY(0)}
.ht{font-size:44px;margin-bottom:8px;display:inline-block;animation:hb 1.5s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.stt{font-family:‘Cormorant Garamond’,serif;font-size:16px;color:#8a9eaa;font-style:italic;letter-spacing:1px}
.fpp{margin-top:12px;opacity:.25;font-size:18px;letter-spacing:12px}
.thi{font-family:‘Cormorant Garamond’,serif;font-size:11px;color:#b0bec5;letter-spacing:2px;opacity:.45}

.ftt{position:absolute;font-family:‘Permanent Marker’,cursive;white-space:nowrap;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.15);will-change:transform,opacity}

.tp{position:absolute;font-size:16px;opacity:0;animation:tpf 2s ease-out forwards;pointer-events:none}
@keyframes tpf{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(.5)}}

.rain-title{
position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
z-index:55;font-family:‘Permanent Marker’,cursive;
font-size:42px;color:white;text-shadow:0 4px 20px rgba(0,0,0,.5),0 0 60px rgba(231,76,60,.4);
pointer-events:none;text-align:center;line-height:1.3;
will-change:transform,opacity;
}
</style>

</head>
<body>
<div class="fx snow-l" id="snow"></div>
<div class="fx husky-l" id="hL"></div>
<div class="fx paw-l" id="pL"></div>
<div class="fx combo-l" id="cL"></div>
<div class="fx flash-l" id="fL"></div>
<div class="rain-overlay" id="rainOv"></div>

<div class="combo" id="combo"><div id="cN">0</div><div class="cl">howls</div><div id="cTT" class="ctt"></div></div>

<div class="env" id="env" onclick="openCard()">
  <div class="env-i">💌</div>
  <div class="env-t">Tap to open</div>
  <div class="env-p">🐾 🐾 🐾</div>
</div>

<div class="card" id="card">
  <div class="ch">Happy Mother's Day</div>
  <div class="dv"></div>
  <div class="msg" id="msg"></div>
  <button class="btn" id="btn" onclick="doHowl(event)">🐺 HOWL! 🐺</button>
  <div class="so" id="so"><div class="ht">❤️</div><div class="stt">With all my love x</div></div>
  <div class="fpp">🐾🐾🐾</div>
  <div class="thi">tap anywhere for paw prints</div>
</div>

function iA(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)}
function pH(n){try{iA();let t=ac.currentTime,b=180+Math.random()*100,v=Math.min(.12+n*.008,.28);
  let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';
  o.frequency.setValueAtTime(b,t);o.frequency.linearRampToValueAtTime(b+250+n*40,t+.2);
  o.frequency.linearRampToValueAtTime(b+350+n*60,t+.5);o.frequency.exponentialRampToValueAtTime(b+80,t+1);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.04);g.gain.setValueAtTime(v,t+.5);
  g.gain.exponentialRampToValueAtTime(.001,t+1.1);o.start(t);o.stop(t+1.2);
  let o2=ac.createOscillator(),g2=ac.createGain();o2.connect(g2);g2.connect(ac.destination);o2.type='triangle';
  o2.frequency.setValueAtTime(b*1.5,t);o2.frequency.linearRampToValueAtTime(b*2.2+n*30,t+.35);
  o2.frequency.exponentialRampToValueAtTime(b*.8,t+.85);g2.gain.setValueAtTime(0,t);
  g2.gain.linearRampToValueAtTime(v*.45,t+.08);g2.gain.exponentialRampToValueAtTime(.001,t+.9);
  o2.start(t);o2.stop(t+1);
  for(let i=0;i<Math.min(Math.floor((n-3)/2),5);i++){let o3=ac.createOscillator(),g3=ac.createGain();
  o3.connect(g3);g3.connect(ac.destination);o3.type=['sine','triangle','sawtooth'][i%3];
  let f=b*(1.1+i*.25)+Math.random()*60,d=i*.06;o3.frequency.setValueAtTime(f,t+d);
  o3.frequency.linearRampToValueAtTime(f+280,t+d+.3);o3.frequency.exponentialRampToValueAtTime(f*.4,t+d+.7);
  g3.gain.setValueAtTime(0,t+d);g3.gain.linearRampToValueAtTime(.05,t+d+.04);
  g3.gain.exponentialRampToValueAtTime(.001,t+d+.6);o3.start(t+d);o3.stop(t+d+.7)}}catch(e){}}

function pRainHowl(){try{iA();let t=ac.currentTime;
  for(let i=0;i<6;i++){let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=['sine','triangle','sawtooth','sine','triangle','sine'][i];
  let b=120+i*60+Math.random()*40,d=i*.12;
  o.frequency.setValueAtTime(b,t+d);o.frequency.linearRampToValueAtTime(b+400,t+d+.4);
  o.frequency.linearRampToValueAtTime(b+500,t+d+1);o.frequency.exponentialRampToValueAtTime(b*.5,t+d+1.8);
  g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.08,t+d+.06);
  g.gain.setValueAtTime(.08,t+d+.8);g.gain.exponentialRampToValueAtTime(.001,t+d+2);
  o.start(t+d);o.stop(t+d+2.1)}}catch(e){}}

// ═══ ALL ANIMATIONS VIA WEB ANIMATIONS API — works everywhere ═══

function launch(cnt,n){
  let l=document.getElementById("hL"),vw=innerWidth,vh=innerHeight;
  for(let i=0;i<cnt;i++){
    let h=document.createElement("img");h.className="fh";h.src=rI();
    let sz=70+Math.random()*50+n*3;
    h.style.width=sz+"px";h.style.height=sz+"px";
    // Scatter across full viewport
    let px=Math.random()*vw;
    let py=Math.random()*vh;
    h.style.left=px+"px";h.style.top=py+"px";
    let peak=1.4+Math.random()*1+n*.08;
    let land=.25+Math.random()*.2;
    let r0=Math.random()*40-20;
    let spin=(Math.random()-.5)*300;
    let dur=1000+Math.random()*800;
    let delay=Math.random()*500;
    l.appendChild(h);
    let anim=h.animate([
      {opacity:0,transform:"scale(0.1) rotate("+r0+"deg)",offset:0},
      {opacity:1,transform:"scale("+peak+") rotate("+(r0+spin*.4)+"deg)",offset:.3},
      {opacity:1,transform:"scale("+(peak*.95)+") rotate("+(r0+spin*.6)+"deg)",offset:.5},
      {opacity:.7,transform:"scale("+land+") rotate("+(r0+spin*.85)+"deg)",offset:.8},
      {opacity:0,transform:"scale("+(land*.5)+") rotate("+(r0+spin)+"deg)",offset:1}
    ],{duration:dur,delay:delay,easing:"cubic-bezier(.2,.8,.3,1)",fill:"forwards"});
    anim.onfinish=()=>h.remove();
  }
}

          {transform:"translateY("+(vh+100)+"px) scale(.5) rotate(-20deg)",opacity:0,offset:1}
        ],{duration:3000+Math.random()*1500,fill:"forwards"}).onfinish=()=>h.remove();
        setTimeout(()=>burst(bx+sz/2,vh*.65,20,15),2000);
      },i*250);
    }
  },800);

  // Wave 3: fast barrage
  setTimeout(()=>{
    flash();shake(true);
    for(let i=0;i<25;i++){
      setTimeout(()=>{
        let h=document.createElement("img");h.className="hr";h.src=rI();
        let sz=40+Math.random()*70;
        h.style.width=sz+"px";h.style.height=sz+"px";
        h.style.left=Math.random()*vw+"px";h.style.top="-80px";
        l.appendChild(h);
        let rr=Math.random()*120-60;
        h.animate([
          {transform:"translateY(0) rotate(0) scale(.8)",opacity:.9,offset:0},
          {transform:"translateY("+(vh+80)+"px) rotate("+rr+"deg) scale(.3)",opacity:0,offset:1}
        ],{duration:1500+Math.random()*1500,fill:"forwards"}).onfinish=()=>h.remove();
      },i*50);
    }
  },2500);

  // Bursts during rain
  for(let i=0;i<12;i++){
    setTimeout(()=>burst(Math.random()*vw,Math.random()*vh,15,15),500+i*200);
  }

  setTimeout(()=>{ov.classList.remove("active");rainActive=false},5500);
}

function burst(x,y,cnt,n){
  let l=document.getElementById("cL");
  let em=["🐾","💙","❄️","🩵","⭐","✨","💜","❤️"];
  for(let i=0;i<cnt;i++){
    let p=document.createElement("span");p.className="bp";
    p.textContent=em[Math.floor(Math.random()*em.length)];
    p.style.left=x+"px";p.style.top=y+"px";
    p.style.fontSize=(14+Math.random()*18+n*2)+"px";
    let a=(Math.PI*2/cnt)*i+Math.random()*.4;
    let d=50+Math.random()*120+n*12;
    let bx=Math.cos(a)*d,by=Math.sin(a)*d;
    l.appendChild(p);
    p.animate([
      {transform:"translate(0,0) scale(.5)",opacity:1},
      {transform:"translate("+bx+"px,"+by+"px) scale("+(0.4+Math.random())+")",opacity:0}
    ],{duration:500+Math.random()*700,fill:"forwards"}).onfinish=()=>p.remove();
  }
}

function fltTxt(x,y,txt,n){
  let l=document.getElementById("cL"),f=document.createElement("div");f.className="ftt";
  f.textContent=txt;
  f.style.left=(x+(Math.random()-.5)*80)+"px";
  f.style.top=(y-40+(Math.random()-.5)*40)+"px";
  f.style.color=FC[Math.floor(Math.random()*FC.length)];
  f.style.fontSize=(20+Math.min(n*2,34))+"px";
  let sc=.8+Math.min(n*.12,2);
  let rot=(Math.random()-.5)*20;
  l.appendChild(f);
  f.animate([
    {opacity:1,transform:"translateY(0) scale("+sc+") rotate("+rot+"deg)"},
    {opacity:0,transform:"translateY(-140px) scale("+(sc*.5)+") rotate("+(rot*.5)+"deg)"}
  ],{duration:1500,fill:"forwards"}).onfinish=()=>f.remove();
}

function flash(){let f=document.getElementById("fL");f.classList.add("flash");setTimeout(()=>f.classList.remove("flash"),80)}
function shake(m){document.body.classList.remove("shake","megashake");void document.body.offsetWidth;
  document.body.classList.add(m?"megashake":"shake");setTimeout(()=>document.body.classList.remove("shake","megashake"),m?600:400)}

function uCo(){co++;let e=document.getElementById("combo"),n=document.getElementById("cN"),t=document.getElementById("cTT");
  e.classList.add("show");e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop");n.textContent=co+"x";
  let tt="";for(let[th,lb] of Object.entries(CTT))if(co>=parseInt(th))tt=lb;t.textContent=tt;
  e.style.transform="scale("+Math.min(1+co*.04,2.8)+")";
  clearTimeout(coT);coT=setTimeout(()=>{co=0;e.classList.remove("show");e.style.transform="scale(1)";t.textContent=""},3500)}

function uBtn(){let b=document.getElementById("btn");b.classList.remove("mega","ultra","god");
  if(co>=20){b.classList.add("god");b.textContent="👑 LEGENDARY HOWL!!! 👑"}
  else if(co>=15){b.classList.add("ultra");b.textContent="🐺🐺🐺 ULTRA HOWL!!! 🐺🐺🐺"}
  else if(co>=8){b.classList.add("mega");b.textContent="🐺🐺 MEGA HOWL!! 🐺🐺"}
  else if(co>=4)b.textContent="🐺 HOWL MORE! 🐺";
  else b.textContent="🐺 HOWL! 🐺"}

function cBg(){let c=["c1","c2","c3","c4","c5"];document.body.classList.remove(...c,"open");
  if(co<=2)document.body.classList.add("open");else document.body.classList.add(c[co%c.length])}

function doHowl(e){
  e.stopPropagation();
  let r=e.target.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  uCo();uBtn();cBg();
  let n=Math.min(co,25),hc=Math.min(3+co*2,35),bc=Math.min(6+co*3,50);
  pH(n);launch(hc,n);burst(cx,cy,bc,n);
  let tc=Math.min(1+Math.floor(co/4),4);
  for(let i=0;i<tc;i++){let t=HTX[Math.min(co-1+i,HTX.length-1)];setTimeout(()=>fltTxt(cx,cy,t,n),i*120)}
  if(co>=3)shake(false);
  if(co>=8){shake(true);flash()}
  if(co>=12&&!rainActive)huskyRainEvent();
  if(co>=15){setTimeout(()=>launch(15,n),100);setTimeout(()=>burst(cx,cy,30,n),200)}
  if(co>=20){
    for(let i=0;i<5;i++)setTimeout(()=>{burst(Math.random()*innerWidth,Math.random()*innerHeight,20,n);launch(8,n)},i*100);
    if(!rainActive)huskyRainEvent();flash();setTimeout(flash,150);setTimeout(flash,300)}
}

document.body.addEventListener("click",e=>{if(!isOpen)return;let l=document.getElementById("pL");
  let c=1+Math.floor(co/3);for(let i=0;i<Math.min(c,8);i++){let p=document.createElement("span");
  p.className="pp";p.textContent="🐾";p.style.left=(e.clientX-15+(Math.random()-.5)*40*i)+"px";
  p.style.top=(e.clientY-15+(Math.random()-.5)*40*i)+"px";p.style.setProperty("--r",(Math.random()*50-25)+"deg");
  p.style.fontSize=(22+Math.random()*14+co)+"px";l.appendChild(p);setTimeout(()=>p.remove(),1600)}});

let lt=0;document.body.addEventListener("touchmove",e=>{if(!isOpen)return;let now=Date.now();
  if(now-lt<50)return;lt=now;let t=e.touches[0],l=document.getElementById("pL");
  let p=document.createElement("span");p.className="tp";p.textContent="🐾";
  p.style.left=(t.clientX-8)+"px";p.style.top=(t.clientY-8)+"px";
  p.style.transform="rotate("+(Math.random()*40-20)+"deg)";l.appendChild(p);
  setTimeout(()=>p.remove(),2200)},{passive:true});
</script>
